# Local setup with a throwaway MongoDB: docker compose up --build
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/taskmanager
      JWT_SECRET: local-dev-secret-change-me
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

volumes:
  mongo-data:
